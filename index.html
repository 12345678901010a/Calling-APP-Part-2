<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord P2P Chat via Supabase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <div class="header">
            <h2># school-p2p-chat</h2>
            
            <div class="id-section">
                <span>YOUR CHAT ID:</span> <span id="my-id" class="id-value">Generating...</span>
            </div>

            <div class="connect-section">
                <input type="text" id="nickname-input" placeholder="Set your nickname..." value="ChromebookUser">
            </div>
            
            <div class="connect-section">
                <input type="text" id="peer-id-input" placeholder="Enter friend's Chat ID...">
                <button id="connect-btn">Connect</button>
            </div>
        </div>

        <div id="chat-box"></div>
        
        <div class="input-section">
            <input type="text" id="message-input" placeholder="Message #school-p2p-chat">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <!-- Calls app directly to skip dependency blocks -->
    <script src="app.js"></script>
</body>
</html>
