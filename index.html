<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord P2P Chat</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div class="chat-container">
        <div class="header">
            <h2># school-p2p-chat</h2>
            <div class="id-section">
                <span>YOUR ID:</span> <span id="my-id" class="id-value">Connecting...</span>
            </div>
            <div class="connect-section">
                <input type="text" id="peer-id-input" placeholder="Enter friend's User ID...">
                <button id="connect-btn">Connect</button>
            </div>
        </div>

        <div id="chat-box"></div>
        
        <div class="input-section">
            <input type="text" id="message-input" placeholder="Message #school-p2p-chat" disabled>
            <button id="send-btn" disabled>Send</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
